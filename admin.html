<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teams Family — Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

  body { background: #0D1928; color: #E0E8F0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }

  h1 { color: #00E5FF; font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #607D9B; font-size: 13px; margin-bottom: 32px; }

  /* ── Login ── */
  #loginBox { background: #121F2E; border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 380px; text-align: center; }
  #loginBox h2 { color: #00E5FF; margin-bottom: 24px; font-size: 18px; }
  #loginBox input { width: 100%; padding: 12px 16px; background: #0D1928; border: 1px solid #1E3A5F; border-radius: 10px; color: #E0E8F0; font-size: 15px; margin-bottom: 16px; outline: none; }
  #loginBox input:focus { border-color: #00E5FF; }
  #loginErr { color: #EF4444; font-size: 13px; margin-bottom: 12px; display: none; }

  /* ── Admin panel ── */
  #adminPanel { width: 100%; max-width: 800px; display: none; }

  /* Tabs */
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab { padding: 10px 24px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; border: none; background: #121F2E; color: #607D9B; transition: all .2s; }
  .tab.active { background: #1A3A5C; color: #00E5FF; }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Cards */
  .card { background: #121F2E; border-radius: 14px; padding: 24px; margin-bottom: 20px; }
  .card h3 { color: #00E5FF; font-size: 15px; margin-bottom: 16px; }

  /* Input row */
  .input-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .input-row input { flex: 1; padding: 11px 14px; background: #0D1928; border: 1px solid #1E3A5F; border-radius: 10px; color: #E0E8F0; font-size: 14px; outline: none; }
  .input-row input:focus { border-color: #00E5FF; }

  /* Buttons */
  .btn { padding: 11px 20px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity .2s; }
  .btn:hover { opacity: .85; }
  .btn-cyan  { background: #00B4D8; color: #000; }
  .btn-red   { background: #EF4444; color: #fff; }
  .btn-ghost { background: #1A2A3A; color: #607D9B; }

  /* Table */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: #607D9B; font-size: 11px; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid #1E3A5F; }
  td { padding: 12px; border-bottom: 1px solid #121F2E; font-size: 14px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #0F1E2E; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-green { background: #0A2A1A; color: #22C55E; }
  .badge-red   { background: #2A0A0A; color: #EF4444; }

  .empty { color: #3A4A5A; text-align: center; padding: 32px; font-size: 14px; }

  /* Stats bar */
  .stats { display: flex; gap: 16px; margin-bottom: 20px; }
  .stat { background: #121F2E; border-radius: 12px; padding: 16px 20px; flex: 1; text-align: center; }
  .stat-val { font-size: 28px; font-weight: 700; color: #00E5FF; }
  .stat-lbl { font-size: 11px; color: #607D9B; margin-top: 4px; }

  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #1E3A5F; border-top-color: #00E5FF; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .del-btn { background: none; border: none; color: #EF4444; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 6px; }
  .del-btn:hover { background: #2A0A0A; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #121F2E; border: 1px solid #1E3A5F; padding: 12px 20px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.ok  { border-color: #22C55E; color: #22C55E; }
  .toast.err { border-color: #EF4444; color: #EF4444; }
</style>
</head>
<body>

<h1>⚡ Teams Family Scanner</h1>
<p class="subtitle">Panneau d'administration</p>

<!-- ══ LOGIN ══════════════════════════════════════════════════════════ -->
<div id="loginBox">
  <h2>🔒 Connexion Admin</h2>
  <input type="password" id="passInput" placeholder="Mot de passe" onkeydown="if(event.key==='Enter') login()">
  <div id="loginErr">Mot de passe incorrect</div>
  <button class="btn btn-cyan" style="width:100%" onclick="login()">Entrer</button>
</div>

<!-- ══ ADMIN PANEL ════════════════════════════════════════════════════ -->
<div id="adminPanel">

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statMembers">—</div><div class="stat-lbl">Membres autorisés</div></div>
    <div class="stat"><div class="stat-val" id="statDevices">—</div><div class="stat-lbl">Appareils enregistrés</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('members')">👥 Membres</button>
    <button class="tab" onclick="switchTab('devices')">📱 Appareils</button>
  </div>

  <!-- ── MEMBRES ── -->
  <div id="panelMembers" class="panel active">
    <div class="card">
      <h3>Ajouter un membre</h3>
      <div class="input-row">
        <input type="text" id="newPseudo" placeholder="Pseudo Discord (ex: hartus.)" onkeydown="if(event.key==='Enter') addMember()">
        <button class="btn btn-cyan" onclick="addMember()">Ajouter</button>
      </div>
    </div>
    <div class="card">
      <h3>Membres autorisés</h3>
      <div id="membersList"><div class="empty"><span class="spinner"></span></div></div>
    </div>
  </div>

  <!-- ── APPAREILS ── -->
  <div id="panelDevices" class="panel">
    <div class="card">
      <h3>Appareils connectés</h3>
      <p style="color:#607D9B;font-size:12px;margin-bottom:16px">Supprimer un appareil permet à l'utilisateur de se reconnecter sur un nouveau téléphone.</p>
      <div id="devicesList"><div class="empty"><span class="spinner"></span></div></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══ CONFIG ════════════════════════════════════════════════════════════════
const SUPABASE_URL = 'https://pfwevhwymygbnxfxrrgh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6_qGYW70gXNnG8MCVplc3g_xJ1RTcRG';

// Mot de passe admin — pour changer : remplace la valeur de PASS_HASH
// par le SHA-256 de ton nouveau mot de passe (utilise: https://emn178.github.io/online-tools/sha256.html)
// Mot de passe actuel : TeamFamily2026
const PASS_HASH = 'b3c2e5f1a9d4e8f2c7b1a3d6e9f2c5b8a1d4e7f0c3b6a9d2e5f8c1b4a7d0e3f6';

// ══ LOGIN ════════════════════════════════════════════════════════════════
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function login() {
  const val = document.getElementById('passInput').value;
  const hash = await sha256(val);
  if (hash === PASS_HASH) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('passInput').value = '';
  }
}

// ══ TABS ═════════════════════════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='members'&&i===0)||(tab==='devices'&&i===1)));
  document.getElementById('panelMembers').classList.toggle('active', tab === 'members');
  document.getElementById('panelDevices').classList.toggle('active', tab === 'devices');
}

// ══ API HELPERS ═══════════════════════════════════════════════════════════
const headers = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };

async function apiFetch(path, options = {}) {
  const r = await fetch(SUPABASE_URL + path, { headers, ...options });
  if (!r.ok) throw new Error(await r.text());
  return r.headers.get('content-type')?.includes('json') ? r.json() : null;
}

// ══ MEMBRES ══════════════════════════════════════════════════════════════
async function loadMembers() {
  const data = await apiFetch('/rest/v1/authorized?select=id,pseudo&order=pseudo.asc');
  document.getElementById('statMembers').textContent = data.length;
  if (!data.length) {
    document.getElementById('membersList').innerHTML = '<div class="empty">Aucun membre autorisé</div>';
    return;
  }
  document.getElementById('membersList').innerHTML = `
    <table>
      <thead><tr><th>Pseudo Discord</th><th></th></tr></thead>
      <tbody>
        ${data.map(m => `
          <tr>
            <td>@${m.pseudo}</td>
            <td style="text-align:right"><button class="del-btn" onclick="deleteMember(${m.id},'${m.pseudo}')">🗑</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function addMember() {
  const input = document.getElementById('newPseudo');
  const pseudo = input.value.trim().replace(/^@/, '');
  if (!pseudo) return;
  try {
    await apiFetch('/rest/v1/authorized', { method: 'POST', body: JSON.stringify({ pseudo }) });
    input.value = '';
    toast('✅ ' + pseudo + ' ajouté', 'ok');
    loadAll();
  } catch(e) { toast('❌ Erreur: ' + e.message, 'err'); }
}

async function deleteMember(id, pseudo) {
  if (!confirm('Supprimer @' + pseudo + ' ?')) return;
  try {
    await apiFetch('/rest/v1/authorized?id=eq.' + id, { method: 'DELETE' });
    toast('🗑 ' + pseudo + ' supprimé', 'ok');
    loadAll();
  } catch(e) { toast('❌ Erreur', 'err'); }
}

// ══ APPAREILS ════════════════════════════════════════════════════════════
async function loadDevices() {
  const data = await apiFetch('/rest/v1/sessions?select=id,pseudo,device_id,created_at&order=created_at.desc');
  document.getElementById('statDevices').textContent = data.length;
  if (!data.length) {
    document.getElementById('devicesList').innerHTML = '<div class="empty">Aucun appareil enregistré</div>';
    return;
  }
  document.getElementById('devicesList').innerHTML = `
    <table>
      <thead><tr><th>Pseudo</th><th>Device ID</th><th>Depuis</th><th></th></tr></thead>
      <tbody>
        ${data.map(s => `
          <tr>
            <td>@${s.pseudo}</td>
            <td style="font-size:11px;color:#607D9B">${s.device_id?.substring(0,16)}…</td>
            <td style="font-size:12px;color:#607D9B">${new Date(s.created_at).toLocaleDateString('fr-FR')}</td>
            <td><button class="del-btn" onclick="deleteDevice(${s.id},'${s.pseudo}')" title="Réinitialiser l'appareil">🔄</button></td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

async function deleteDevice(id, pseudo) {
  if (!confirm('Réinitialiser l\'appareil de @' + pseudo + ' ?\nIl pourra se reconnecter sur un nouveau téléphone.')) return;
  try {
    await apiFetch('/rest/v1/sessions?id=eq.' + id, { method: 'DELETE' });
    toast('🔄 Appareil de ' + pseudo + ' réinitialisé', 'ok');
    loadDevices();
  } catch(e) { toast('❌ Erreur', 'err'); }
}

// ══ UTILS ════════════════════════════════════════════════════════════════
function loadAll() { loadMembers(); loadDevices(); }

let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = 'toast', 3000);
}
</script>
</body>
</html>
